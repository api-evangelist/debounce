method: probed
source: https://feedback.debounce.com/changelog
description: >-
  DeBounce publishes a product changelog and a public roadmap on a hosted
  feedback portal. Both pages return HTTP 200 but render entirely client-side, so
  no dated entries could be read without executing JavaScript. The change record
  that IS machine-readable is the status page's incident feed, which is a
  different thing (availability events, not releases) and is captured in
  lifecycle/. This artifact records the surface honestly rather than inventing a
  release history.

