method: searched
source: >-
  registry queries against npm, PyPI, Packagist, RubyGems, crates.io and the
  WordPress.org plugin API, plus the DeBounce GitHub organization
  (https://github.com/debounceio) and the integrations pages on debounce.com
description: >-
  DeBounce publishes NO first-party client SDK library on any language package
  registry. What it does distribute officially is platform plugins and sample
  code: a WordPress plugin on WordPress.org, a Google Sheets add-on on Google
  Workspace Marketplace, an unpinned JavaScript widget loader on its own CDN, and
  a single PHP sample script on GitHub. Integrators call the REST API directly
  with an HTTP client. Because the API is a query-string GET surface with no
  request bodies, the absence of an SDK is a lower cost here than it would be for
  most APIs — but it is still an absence, and it is recorded as one.

