  note: >-
    The distribution is UNPINNED — the documented snippet on
    https://debounce.com/solutions/javascript-widget/ loads a bare
    cdn.debounce.io/widget.js with no version segment and no integrity hash, so a
    consumer cannot tell which build they are getting and neither can this probe.
    There is no jsDelivr/unpkg metadata endpoint for a vendor CDN. Recorded as
    null after checking, not as unchecked. Separately, a live GET of that exact
    URL returned HTTP 200 with content-length 0 and content-type image/jpeg on
    2026-08-14, both with and without a browser User-Agent and Referer — the
    documented loader served an empty body at probe time.
  x-evidence:
