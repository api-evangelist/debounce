- aid: debounce:debounce-bulk-api
  name: DeBounce Bulk API
  description: >-
    Asynchronous bulk email list validation on bulk.debounce.io. Submit the URL
    of a hosted CSV or TXT list for processing, receive a list_id, then poll the
    status endpoint for the processing percentage and the completed download
    link. One active bulk job is permitted per account; additional jobs queue.
