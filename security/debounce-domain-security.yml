findings:
- >-
  HSTS is set on the marketing site (debounce.com), the developer portal
  (developers.debounce.com, max-age 63072000 — the longest in the profile) and
  the dashboard (app.debounce.io), but on NONE of the four API hosts:
  api.debounce.io, bulk.debounce.io, disposable.debounce.io and
  logo.debounce.com all answer without a Strict-Transport-Security header. Since
  the API key travels in the query string, an API host without HSTS is the
  weakest link in this profile.
- >-
  Neither registrable domain has DNSSEC enabled. debounce.com publishes no CAA
  record at all; debounce.io does.
- >-
  Both domains publish SPF and a DMARC policy of p=reject, which is the strong
  posture expected of an email-deliverability vendor.
- >-
  No RFC 9116 security.txt is served on any host, and no vulnerability
  disclosure program or trust center was found — see
  well-known/debounce-well-known.yml.
domains:
- domain: debounce.com
  dnssec: false
  caa: []
  spf: true
  dmarc: true
  dmarc_policy: reject
