generated: '2026-08-14'
method: searched
source: >-
  derived from the 4xx responses in openapi/ and enriched from
  https://developers.debounce.com/api-concepts/https-codes and
  https://developers.debounce.com/api-concepts/responses
format: vendor-envelope
rfc9457: false
description: >-
  DeBounce does not use RFC 9457 problem+json. Errors come back as
  application/json with the vendor envelope {"debounce":{"error":"...","code":"0"},
  "success":"0"} — a human-readable string in `error` and a `code` that is "0" on
  every documented failure, so the code field does not discriminate between error
  classes. The only machine-usable discriminators are the HTTP status and a
  string match on the message, both recorded below.

envelope:
  content_type: application/json
  fields:
  - field: success
    values: ['0']
    meaning: always "0" on an error response
  - field: debounce.error
    meaning: human-readable error message — the only discriminator between failures
  - field: debounce.code
    meaning: >-
      documented as an error code but returns the literal "0" on every published
      error example. Not a usable classifier.
  - field: debounce.loc
    meaning: >-
      Observed live on a 401 from https://api.debounce.io/v1/ (value "1") but
      absent from the published Error schema. Undocumented.

problems:
- status: 401
  title: Unauthorized
  message: Wrong API
  meaning: The API key is missing, invalid, or not permitted.
  remediation: >-
    Check the `api` query parameter carries a valid 13-character key from
    https://app.debounce.io/api.
  retryable: false
  source_operations:
  - openapi/debounce-validation-api-openapi.yml#validateEmail
  - openapi/debounce-data-api-openapi.yml#reverseEmailLookup
  - openapi/debounce-account-api-openapi.yml#getBalance
  - openapi/debounce-bulk-api-openapi.yml#uploadBulkList
  verified: probed
