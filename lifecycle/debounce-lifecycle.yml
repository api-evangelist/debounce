  - file: openapi/debounce-bulk-api-openapi.yml
    info_version: 1.0.0
  - file: openapi/debounce-disposable-api-openapi.yml
    info_version: 1.0.0
  note: >-
    /v1/ has been the only published version since the API was documented. No
    v2 exists and no version-negotiation header is documented.

deprecation:
  policy_url: null
