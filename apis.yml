- aid: debounce:debounce-logo-api
  name: DeBounce Logo API
  description: >-
    Free company logo lookup service positioned as a drop-in replacement for the
    deprecated Clearbit Logo API. A GET against logo.debounce.com with a company
    domain returns a high-quality PNG logo served from DeBounce's CDN, falling
    back to a generated monogram when no logo is available. No API key, no
    credits and no attribution are required.
  humanURL: https://developers.debounce.com/api-reference/endpoint/free/logo-api
