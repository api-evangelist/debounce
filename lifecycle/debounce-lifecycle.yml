generated: '2026-08-14'
method: searched
source: >-
  https://status.debounce.com/, https://status.debounce.com/feed.rss,
  https://feedback.debounce.com/changelog, https://feedback.debounce.com/roadmap,
  https://debounce.com/deliverability-guarantee/, and the OpenAPI documents in
  openapi/
description: >-
  DeBounce runs a real, per-component status page with a machine-readable
  incident feed, a public changelog and a public roadmap. What it does NOT
  publish is any API lifecycle policy: there is no versioning policy page, no
  deprecation policy, no Sunset/Deprecation header support, and no uptime SLA.
  The one commitment it does make is about validation ACCURACY, not availability.

