apis:
- aid: debounce:debounce-validation-api
  name: DeBounce Validation API
  description: >-
    Real-time single email address validation. Returns a deliverability result
    (Safe to Send, Risky, Invalid, Unknown), a result code, role-account and
    free-provider flags, a did-you-mean typo suggestion, and the remaining
    credit balance. Optional photo, append and gsuite flags enable enrichment
    and G Suite accept-all detection at extra credit cost.
  humanURL: https://developers.debounce.com/api-reference/endpoint/single-validation
  baseURL: https://api.debounce.io
  tags:
  - Validation
