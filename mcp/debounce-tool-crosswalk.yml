findings:
- >-
  DeBounce's MCP deployment is a documentation server, not an API server. The
  agent-facing execution path for email validation remains the REST API with an
  api= query-string key.
- >-
  The gap is bridged on the agent side by the Agent Skill DeBounce publishes
  (skills/debounce-de-bounce.md), which teaches an agent to call the REST
  endpoints directly. That skill, not the MCP server, is what makes this API
  agent-usable today.
- >-
  The OAuth-gated WordPress MCP endpoint on debounce.com is bound to the
  marketing site (novamira plugin), not to the validation API. Its tool set was
  not enumerated and nothing about it is asserted here.
