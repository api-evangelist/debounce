description: >
  DeBounce uses a pay-as-you-go credit-based pricing model with no monthly
  subscription required. Credits are purchased in volume packages and never
  expire. All features — including full API access — are available at every
  credit tier. Volume discounts apply as the quantity of credits purchased
  increases. There is no enterprise "contact us" wall on the standard ladder;
  a separate enterprise page exists for high-volume arrangements.
