findings:
- >-
  Operational transparency is strong on the runtime side (per-component status,
  RSS incident feed, public roadmap and changelog) and absent on the contract
  side (no versioning policy, no deprecation policy, no Sunset header).
- >-
  A consumer has no documented notice window if /v1/ is ever retired.
