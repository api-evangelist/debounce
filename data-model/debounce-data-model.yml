findings:
- >-
  The API has exactly one addressable resource (BulkList) and no way to
  enumerate it. list_id must be stored client-side at creation time or the job is
  unreachable.
- >-
  The richest data the API produces — the per-address results of a bulk run —
  exists only as a CSV behind download_link and is not described by any schema.
- >-
  ReverseResult.data is an open object, so the enrichment product has no
  contract at all from the machine-readable surface.

