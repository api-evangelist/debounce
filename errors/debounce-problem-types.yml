    url: https://api.debounce.io/v1/?email=test@example.com
    fetched: '2026-08-14'
    http_status: 401
    body: '{"debounce":{"error":"Wrong API", "code":"0", "loc":"1"},"success":"0"}'

- status: 402
  title: Payment Required
  message: Credits Low
  alternate_message: You have exhausted your credits, please add additional credits to continue.
  meaning: The account's validation credits are exhausted.
  remediation: Purchase additional credits at https://debounce.com/pricing/ and retry.
  retryable: false
  source_operations:
  - openapi/debounce-validation-api-openapi.yml#validateEmail
  - openapi/debounce-bulk-api-openapi.yml#uploadBulkList

- status: 403
  title: Forbidden
  meaning: The request is not allowed for this API key or operation.
  remediation: >-
    Most commonly a `public_` key used from an origin that is not on the key's
    approved CORS domain list, or a public key calling a private-only operation.
  retryable: false
  source_operations: []
  note: >-
    Documented on the HTTP status codes page but declared in none of the five
    published OpenAPI documents — a docs/spec gap.

- status: 404
  title: Bad list identifier
  message: List ID is not valid.
  meaning: The list_id passed to the bulk status endpoint does not exist.
  remediation: Use the list_id returned by uploadBulkList.
  retryable: false
  source_operations:
  - openapi/debounce-bulk-api-openapi.yml#checkBulkStatus
  note: >-
    The spec returns this condition inside a 200 response example rather than as
    a distinct status — checkBulkStatus declares only a 200. An error here is
    detected by reading success == "0", not by the HTTP status.

- status: 400
  title: Bad Request
  message: URL parameter is not valid.
  meaning: The bulk `url` parameter is not a valid https URL to a CSV/TXT list.
  remediation: >-
    Host the list at a public https URL ending in .csv or .txt and pass it as
    `url`.
  retryable: false
  source_operations:
  - openapi/debounce-bulk-api-openapi.yml#uploadBulkList
  - openapi/debounce-data-api-openapi.yml#reverseEmailLookup

- status: 429
  title: Too Many Requests — concurrency
  message: Maximum concurrent calls reached
  meaning: >-
    More than 5 concurrent private-key calls (2 when the append enrichment flag
    is set) were in flight.
  remediation: >-
    Queue requests and back off. No Retry-After header is returned, so the client
    must choose its own backoff.
  retryable: true
  source_operations:
  - openapi/debounce-validation-api-openapi.yml#validateEmail
  - openapi/debounce-bulk-api-openapi.yml#uploadBulkList

- status: 429
  title: Too Many Requests — daily per-IP limit
  message: Authentication Failed - The maximum number of calls per day reached.
  meaning: >-
    A `public_` browser key exceeded 20 validations from one internet IP address
    in a day.
  remediation: >-
    Move the call server-side with a private key, or wait for the daily window to
    reset.
  retryable: false
  source_operations:
  - openapi/debounce-validation-api-openapi.yml#validateEmail

- status: 200
  title: Bulk queue saturated
  message: >-
    You have reached the maximum number of API bulk verify requests. Please try
    after the existing request completes.
  meaning: >-
    Only one active bulk job is permitted per account. This is returned as a
    200 with success == "0", NOT as a 429.
  remediation: Poll checkBulkStatus until the active job completes, then resubmit.
  retryable: true
  source_operations:
  - openapi/debounce-bulk-api-openapi.yml#uploadBulkList

findings:
- >-
  Two failure conditions (bulk queue saturated, invalid list ID) are delivered
  inside HTTP 200 responses. A client that branches on status code alone will
  treat both as success. Always check the `success` flag.
- >-
  `debounce.code` is "0" for every documented error, so there is no stable error
  code vocabulary to switch on — remediation logic has to match on the message
  string.
- >-
  No Retry-After header accompanies either 429, so backoff timing is entirely the
  client's problem.

