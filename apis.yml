aid: debounce
name: DeBounce
description: 'DeBounce is an email validation and verification REST API that helps developers ensure the
  deliverability and quality of email addresses at scale. The API supports real-time single email validation,
  asynchronous bulk list processing, and data enrichment via reverse email lookup. It detects disposable
  addresses, role-based emails, catch-all domains, syntax errors, and performs MX record and SMTP-level
  mailbox verification. DeBounce offers pay-as-you-go credit-based pricing with no monthly subscription
  required, full API access at every tier, and credits that never expire. The surface is split across
  four hosts — api.debounce.io for validation, enrichment and account operations, bulk.debounce.io for
  asynchronous list jobs, disposable.debounce.io for the free disposable detector, and logo.debounce.com
  for the free company logo lookup — and DeBounce publishes OpenAPI 3.1.0, llms.txt, an A2A agent card,
  an agent skill and a remote MCP server from its developer portal.

  '
