  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    No deprecation policy, no notice period, and no RFC 8594 Sunset/Deprecation
    header support could be found on the developer portal, the help centre or the
    marketing site. No Deprecation pointer is emitted for this provider.

deprecated_operations: []

sla:
  uptime_target: null
  uptime_sla_published: false
  accuracy_guarantee:
    published: true
    url: https://debounce.com/deliverability-guarantee/
    headline: 97.5% or better deliverability rate guarantee
    detail:
    - 95%+ accuracy on Microsoft accounts (Office 365, Hotmail, MSN, Outlook, Live)
    - 98%+ accuracy on everything else
    exclusions:
    - Yahoo! and AOL addresses under the deactivation process
    - GMX and WEB.de domains, where bounce rates may exceed 10%
    - free.fr, orange.fr, sfr.fr, comcast.net, att.net (high Unknown rate)
    - Purchased (non-opt-in) lists
    - Bounces from sender reputation, blacklisting, throttling or spam content
    eligibility:
    - Batch of at least 1,000 addresses verified with DeBounce
    - Sent within a 48-hour period
    - Addresses classified Deliverable / Safe to Send
    note: >-
      This is a results-accuracy commitment, not an availability SLA. There is no
      published uptime target and no service-credit schedule.

