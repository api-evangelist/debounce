findings:
- >-
  There is no API changelog. The changelog that exists is a product changelog on
  a marketing feedback portal, and it does not distinguish breaking API changes
  from feature announcements.
- >-
  Because the portal renders client-side and serves no feed, a consumer cannot
  subscribe programmatically to DeBounce product changes. The provider could fix
  this by enabling a feed on the Supahub portal.
